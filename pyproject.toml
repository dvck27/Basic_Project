[project]
name = "pai-auto"
version = "0.1.0"
description = "Motor local y portátil para procesar registros de vacunación hacia PAIWEB"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
real = [
  "playwright>=1.55,<2",
  "google-api-python-client>=2.180,<3",
  "google-auth>=2.40,<3",
]
dev = [
  "pytest>=8.4,<9",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
pai-auto = "pai_auto.main:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pai_auto = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
